[package]
name = "crow_web"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["tokio", "json", "query", "form", "matched-path", "original-uri", "ws"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync"], optional = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }
tungstenite = { version = "0.28.0", optional = true }
tokio-stream = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
tower-http = { version = "0.6.8", features = ["cors", "fs"], optional = true }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"], optional = true }
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"], optional = true }
uuid = { version = "1.21.0", features = ["v4"], optional = true }
rmp-serde = { version = "1.3.1", optional = true }
# the signed cookie a sign-in travels in
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

crow_runtime = { version = "0.1.0", path = "../crow_runtime" }

[features]
default = []
# a streamed response (`stream[feed]`) is a body the server sends as it comes
http = ["dep:axum", "dep:tokio", "dep:tokio-stream"]
client = ["dep:reqwest"]
ws = ["dep:tungstenite"]
cors = ["dep:tower-http", "dep:axum", "dep:tokio"]
static_files = ["dep:tower-http", "dep:axum", "dep:tokio"]
upload = ["dep:axum", "dep:tokio"]
rate = ["dep:axum", "dep:tokio"]
auth = ["dep:jsonwebtoken", "dep:axum", "dep:tokio", "dep:uuid"]
mail = ["dep:lettre", "dep:tokio"]
# a live page is served, so live carries the server (http): a program that
# imports ui and not web had not built compiled
live = ["http", "dep:axum", "dep:tokio", "dep:tokio-stream", "dep:futures-util", "dep:reqwest", "dep:uuid", "dep:hmac", "dep:sha2", "dep:base64"]
view = []
msgpack = ["dep:rmp-serde"]
# the frame as Arrow is the runtime's (crow_runtime::frame::to_arrow_ipc)
arrow_ipc = ["crow_runtime/arrow"]

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
# the live tests drive a served page over a real socket
tungstenite = "0.28.0"

