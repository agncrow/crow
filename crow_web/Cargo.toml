[package]
name = "crow_web"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["tokio", "json", "query", "form", "matched-path", "original-uri", "ws"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"], optional = true }
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }
tungstenite = { version = "0.28.0", optional = true }
tokio-stream = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
tower-http = { version = "0.6.8", features = ["cors", "fs"], optional = true }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"], optional = true }
tera = { version = "1.20.1", optional = true }
rusqlite = { version = "0.38.0", features = ["bundled"], optional = true }
tokio-postgres = { version = "0.7.16", optional = true }
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"], optional = true }
moka = { version = "0.12.14", features = ["future"], optional = true }
redis = { version = "1.0.4", features = ["tokio-comp"], optional = true }
uuid = { version = "1.21.0", features = ["v4"], optional = true }
rmp-serde = { version = "1.3.1", optional = true }
arrow = { version = "58.0.0", features = ["ipc"], optional = true }

[features]
default = []
http = ["dep:axum", "dep:tokio"]
client = ["dep:reqwest"]
ws = ["dep:tungstenite"]
sse = ["dep:tokio-stream", "dep:futures-util", "dep:axum", "dep:tokio"]
cors = ["dep:tower-http", "dep:axum", "dep:tokio"]
static_files = ["dep:tower-http", "dep:axum", "dep:tokio"]
upload = ["dep:axum", "dep:tokio"]
rate = ["dep:axum", "dep:tokio"]
auth = ["dep:jsonwebtoken", "dep:axum", "dep:tokio", "dep:uuid"]
session = ["dep:axum", "dep:tokio", "dep:uuid"]
template = ["dep:tera"]
db = ["dep:rusqlite", "dep:tokio-postgres", "dep:tokio"]
mail = ["dep:lettre", "dep:tokio"]
cache = ["dep:moka", "dep:tokio"]
queue = ["dep:tokio"]
docs = ["dep:axum", "dep:tokio"]
live = ["dep:axum", "dep:tokio", "dep:tokio-stream", "dep:futures-util", "dep:reqwest"]
view = []
msgpack = ["dep:rmp-serde"]
arrow_ipc = ["dep:arrow"]
stream = ["dep:tokio-stream", "dep:futures-util", "dep:axum", "dep:tokio"]

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

