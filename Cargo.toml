[workspace]
members = [".", "crow_runtime", "crow_web", "crow_db"]
exclude = [".crow_build"]
resolver = "3"

[package]
name = "crow"
version = "0.5.0"
edition = "2024"
license-file = "LICENSE"

[dependencies]
bincode = "1"
rayon = "1.11.0"
rustyline = "17.0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# the interpreter reads every source and format a program may name
crow_runtime = { path = "crow_runtime", features = ["parquet"] }
regex = "1.12.3"
sha2 = "0.10.9"
md-5 = "0.10.6"
chrono = "0.4.44"
crow_db = { version = "0.1.0", path = "crow_db", features = ["postgres", "sqlite", "clickhouse"] }
# the interpreter answers every response the compiled program does:
# msgpack and arrow among them (spec, Core (Server))
crow_web = { version = "0.1.0", path = "crow_web", default-features = false, features = ["live", "http", "mail", "arrow_ipc"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# `crow kernel`: Jupyter's protocol over ZeroMQ (in Rust, no libzmq to
# install), its messages signed with HMAC-SHA256, a cell's output read from
# the process's own stdout and stderr
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
hmac = "0.12"
bytes = "1"
libc = "0.2"
tungstenite = "0.28.0"
sqlparser = "0.62.0"
lsp-server = "0.10.0"
lsp-types = "0.97.0"

# An arithmetic overflow inside the interpreter or the runtime stops the
# program in every build, as the debug build does: a release binary never
# wraps a value round silently (crow_runtime::stops, spec: When a Program
# Stops). Generated programs build with the same setting.
[profile.release]
overflow-checks = true
