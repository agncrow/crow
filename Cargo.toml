[workspace]
members = [".", "crow_runtime", "crow_web", "crow_db"]
exclude = [".crow_build"]
resolver = "3"

[package]
name = "crow"
version = "0.4.0"
edition = "2024"

[dependencies]
bincode = "1"
rayon = "1.11.0"
rustyline = "17.0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
crow_runtime = { path = "crow_runtime" }
regex = "1.12.3"
sha2 = "0.10.9"
md-5 = "0.10.6"
chrono = "0.4.44"
crow_db = { version = "0.1.0", path = "crow_db", features = ["sqlite"] }
sqlparser = "0.62.0"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
