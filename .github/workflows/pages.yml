# The book and the specification, built by Crow itself (docs/book/site.co)
# and published on GitHub Pages (https://agncrow.github.io/crow/) on every
# push to main that touches them.
#
# No step runs a JavaScript action, so the workflow needs no Node.js: the
# commit is fetched with git, Rust installed with the runner's rustup, and
# the rendered site pushed as the one commit of the `gh-pages` branch, which
# the repository's Pages serve (Settings → Pages → Deploy from a branch:
# gh-pages, /). GitHub's upload-pages-artifact and deploy-pages actions,
# which the Actions source of Pages needs, run on Node.js.
name: Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The repository at this commit
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" fetch -q --depth 1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Rust (the runner's rustup)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build crow
        run: cargo build --release --locked
      - name: Render the book
        run: |
          ./target/release/crow run -i docs/book/site.co
          cp assets/favicon.ico assets/apple-touch-icon.png docs/book/crow-site/
          test -f docs/book/crow-site/index.html && test -f docs/book/crow-site/ch01-01-toolchain.html
          n=$(find docs/book/crow-site -name '*.html' | wc -l); echo "$n pages"; test "$n" -ge 90
      # the site as the one commit of gh-pages (no history kept: each push
      # is the whole site), served as it is written (.nojekyll)
      - name: Publish the site to the gh-pages branch
        run: |
          cd docs/book/crow-site
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="crow pages" -c user.email="crow-pages@users.noreply.github.com" commit -q -m "The book at $GITHUB_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" push -q --force "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" gh-pages
