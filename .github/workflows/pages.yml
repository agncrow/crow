# The book and the specification, built by Crow itself (docs/book/site.co)
# and published on GitHub Pages (https://agncrow.github.io/crow/) on every
# push to main that touches them.
name: Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build crow
        run: cargo build --release --locked
      - name: Render the book
        run: ./target/release/crow run -i docs/book/site.co && test -f docs/book/crow-site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/crow-site
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
