# A release (docs/distribution-design.md): on a tag v<version>, the crow
# binary for each platform, the runtime bundle and the editor extension are
# built, a fresh machine installs from them and compiles a program with
# nothing but the binary and a linker, and then the GitHub Release the
# install line reads is published. The version is Cargo.toml's, which the
# binary names when it fetches its runtime.
#
# No step runs a JavaScript action, so the release needs no Node.js: the
# commit is fetched with git, Rust installed with the runner's rustup, the
# files gathered on a draft of the release itself with `gh` (GitHub's CLI,
# a Go binary) — each job uploads what it built, the fresh machines install
# from the draft — and the extension packaged by Python's standard library
# (editors/vscode/package_vsix.py) and sent to Open VSX with curl. Run by
# hand (workflow_dispatch), the release is a trial: its draft, named
# trial-<run>, is deleted at the end, and nothing is published.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  RUST_VERSION: "1.93.1"
  GH_TOKEN: ${{ github.token }}
jobs:
  draft:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        name: A draft of the release, for the jobs to put their files on
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) TAG="$GITHUB_REF_NAME" ;;
            *) TAG="trial-$GITHUB_RUN_ID" ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  binaries:
    needs: draft
    strategy:
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: The repository at this commit
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" fetch -q --depth 1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Rust, at the release's version
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - name: Build
        run: cargo build --release --locked
      # the binary asks the machine for its C library and nothing more (no
      # OpenSSL: TLS is rustls) — 0.6.1's Linux binary had needed libssl.so.3
      - name: The binary links only the system's own libraries
        if: runner.os == 'Linux'
        run: |
          readelf -d target/release/crow | grep NEEDED
          if readelf -d target/release/crow | grep -E 'NEEDED.*(libssl|libcrypto)'; then echo "the binary needs OpenSSL"; exit 1; fi
      - name: Package, onto the draft
        run: |
          VERSION="$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          strip target/release/crow || true
          mkdir -p dist
          tar -czf "dist/crow-$VERSION-${{ matrix.triple }}.tar.gz" -C target/release crow
          cd dist && { sha256sum "crow-$VERSION-${{ matrix.triple }}.tar.gz" 2>/dev/null || shasum -a 256 "crow-$VERSION-${{ matrix.triple }}.tar.gz"; } > "crow-$VERSION-${{ matrix.triple }}.tar.gz.sha256"
          ls -la
          gh release upload "${{ needs.draft.outputs.tag }}" ./* --repo "$GITHUB_REPOSITORY" --clobber
  runtime:
    needs: draft
    runs-on: ubuntu-22.04
    steps:
      - name: The repository at this commit
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" fetch -q --depth 1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Rust, at the release's version
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - name: The runtime bundle, onto the draft
        run: |
          scripts/bundle_runtime.sh "$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)" dist
          gh release upload "${{ needs.draft.outputs.tag }}" dist/* --repo "$GITHUB_REPOSITORY" --clobber
  extension:
    needs: draft
    runs-on: ubuntu-22.04
    steps:
      - name: The repository at this commit
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" fetch -q --depth 1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: The VS Code extension, at Crow's version, onto the draft
        run: |
          VERSION="$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          python3 editors/vscode/package_vsix.py "$VERSION" "dist/crow-lang-$VERSION.vsix"
          gh release upload "${{ needs.draft.outputs.tag }}" dist/* --repo "$GITHUB_REPOSITORY" --clobber
  fresh-machine:
    needs: [draft, binaries, runtime]
    strategy:
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      # (into a subdirectory: the binary was built at the runner's default
      # checkout path, and a checkout there would be "the checkout this
      # binary was built from" — a user's machine has none)
      - name: The repository at this commit
        run: |
          git init -q checkout
          cd checkout
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" fetch -q --depth 1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: The release's files, from the draft
        run: gh release download "${{ needs.draft.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'crow-*'
      - name: Install from the binary alone, run interpreted, then fetch the compiler and build
        run: |
          VERSION="$(grep '^version' checkout/Cargo.toml | head -1 | cut -d'"' -f2)"
          export CROW_HOME="$RUNNER_TEMP/crow-home"
          export CROW_DIST_URL="file://$PWD/dist"
          # the install line, from the files this run built
          bash checkout/install.sh --version "$VERSION"
          export PATH="$CROW_HOME/bin:$PATH"
          crow -v
          cd "$RUNNER_TEMP" && crow new hello && cd hello
          crow run -i | grep -q 'hello, hello'
          crow test || true
          # no compiler yet: `crow run` says so and interprets
          crow run 2>err.txt | grep -q 'hello, hello' && grep -q 'no compiler here yet' err.txt
          # the compiler and the runtime, fetched and verified, then a native build
          crow setup
          crow build main.co
          ./main | grep -q 'hello, hello'
          crow setup --check
  release:
    needs: [draft, binaries, runtime, extension, fresh-machine]
    runs-on: ubuntu-22.04
    # Open VSX (Cursor, VSCodium, Gitpod read from there) is published to
    # when the secret OVSX_PAT is set, read at the job level (a step's own
    # env is not visible to its `if`; the job's is). The Visual Studio
    # Marketplace takes the release's .vsix by its web page
    # (marketplace.visualstudio.com/manage): its own command-line publisher
    # runs on Node.js.
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release view "${{ needs.draft.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          gh release edit "${{ needs.draft.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Publish the extension to Open VSX
        if: startsWith(github.ref, 'refs/tags/v') && env.OVSX_PAT != ''
        run: |
          gh release download "${{ needs.draft.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.vsix'
          VSIX="$(ls dist/*.vsix)"
          PUBLISHER="$(unzip -p "$VSIX" extension/package.json | python3 -c 'import json, sys; print(json.load(sys.stdin)["publisher"])')"
          # the namespace is the manifest's publisher, made the first time
          # (Open VSX answers 400 for one that exists)
          curl -sS -X POST -H 'Content-Type: application/json' -d "{\"name\": \"$PUBLISHER\"}" "https://open-vsx.org/api/-/namespace/create?token=$OVSX_PAT" > /dev/null || true
          curl -fsS -X POST -H 'Content-Type: application/octet-stream' --data-binary "@$VSIX" "https://open-vsx.org/api/-/publish?token=$OVSX_PAT"
  # a trial's draft is let go however it ended (a tag's that failed stays,
  # to be run again or deleted by hand)
  tidy:
    needs: [draft, release]
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/v') && needs.draft.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - run: gh release delete "${{ needs.draft.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --yes || true
