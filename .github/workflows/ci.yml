name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # incremental caches are most of a debug target's bulk, and every
      # generated program here is built once
      CARGO_INCREMENTAL: 0
      # each book worker keeps its own dependency build; two fit the runner
      CROW_BOOK_JOBS: 2
    steps:
      - name: Free disk space (the suites compile dozens of programs)
        run: |
          # toolchains no step uses: the suites need Rust and nothing else
          # (no browser, Python or Node)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/.ghcup /usr/share/swift /usr/lib/jvm /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests (a debug build checks the IR of every program it lowers)
        run: cargo test --workspace
      - name: The runtime never panics (clippy refuses an unaudited unwrap, expect or panic in crow_runtime, crow_db and crow_web)
        run: cargo clippy --workspace --all-features
      - name: Live runtime and server tests (the features the workspace run leaves off)
        run: cargo test -p crow_web --features live,http
      - name: Free the unit tests' build (every later step runs the release binary)
        run: rm -rf target/debug && df -h / | tail -1
      - name: Build crow
        run: cargo build --release
      - name: Docs cover the compiler (and nothing more)
        run: ./target/release/crow test --docs
      - name: Parity corpus (both execution modes must agree)
        run: ./target/release/crow test --parity && df -h / | tail -1
      - name: Served pages match across both modes
        run: ./target/release/crow test --served && df -h / | tail -1
      - name: The packages the repository ships (tests, and each example in both modes)
        run: ./target/release/crow test --packages && df -h / | tail -1
      - name: Benchmarks run in both modes (small sizes, no timing thresholds)
        run: ./target/release/crow test --bench --quick
      - name: Free the suites' shared build (the book's workers build their own)
        run: rm -rf .crow_build && df -h / | tail -1
      - name: Book (every code block runs in both modes)
        run: ./target/release/crow test --book && df -h / | tail -1
      - name: Book site built by Crow (layout tested, pages written)
        run: |
          ./target/release/crow test docs/book/site.co
          ./target/release/crow run -i docs/book/site.co
      - name: Layout engine agrees with the browser (fixtures measured once, checked without one)
        run: ./target/release/crow test tests/layout/conformance.co
      - name: Layout engine's own example (the one place Crow builds its nodes, which types them)
        run: ./target/release/crow test src/modules/layout.co
      - name: Layout example
        run: ./target/release/crow test examples/layout_dashboard.co
      - name: Parts (a page composed of modules with facts, derivations and views)
        run: ./target/release/crow test tests/parts/views/sim.co && ./target/release/crow test tests/parts/sim/clock.co && ./target/release/crow check tests/parts/main.co < /dev/null
      - name: The task board, the second reference app (its harness tests, then its check against the accepted baseline; `--served` above drives it in both modes)
        run: |
          cd examples/taskboard
          ../../target/release/crow test board/door.co
          ../../target/release/crow test board/cards.co
          ../../target/release/crow test board/page.co
          ../../target/release/crow check main.co < /dev/null
      - name: The task board's tests against the compiled program (each app a test opens is the compiled one)
        run: |
          cd examples/taskboard
          ../../target/release/crow test --compiled board/door.co
          ../../target/release/crow test --compiled board/cards.co
          ../../target/release/crow test --compiled board/page.co
          rm -rf .crow_build && df -h / | tail -1
      - name: Mail, held to the commit and recorded under test, in the interpreter and the compiled program
        run: |
          ./target/release/crow test tests/mail_harness.co
          ./target/release/crow test --compiled tests/mail_harness.co
          rm -rf .crow_build && df -h / | tail -1
      - name: A record read by a test, in the interpreter and the compiled program
        run: |
          ./target/release/crow test tests/records_harness.co
          ./target/release/crow test --compiled tests/records_harness.co
          rm -rf .crow_build && df -h / | tail -1
      - name: A failed value refused where a plain variable is assigned, in the interpreter and the compiled program
        run: |
          ./target/release/crow test tests/refused_assignment_harness.co
          ./target/release/crow test --compiled tests/refused_assignment_harness.co
          rm -rf .crow_build && df -h / | tail -1
      - name: Records held in a fact, in the interpreter and the compiled program
        run: |
          ./target/release/crow test tests/fact_records_harness.co
          ./target/release/crow test --compiled tests/fact_records_harness.co
          rm -rf .crow_build && df -h / | tail -1
      - name: A helper handed a failed value stops its handler, in the interpreter and the compiled program
        run: |
          ./target/release/crow test tests/failed_helper_argument_harness.co
          ./target/release/crow test --compiled tests/failed_helper_argument_harness.co
          rm -rf .crow_build && df -h / | tail -1
      - name: A chart in the harness, in the interpreter and the compiled program (a program that imports ui and not web had not built compiled)
        run: |
          ./target/release/crow test tests/chart_harness.co
          ./target/release/crow test --compiled tests/chart_harness.co
          rm -rf .crow_build && df -h / | tail -1
      - name: The app's book (derived from the parts fixture, with wireframes)
        run: cd tests/parts && ../../target/release/crow book --write && test -f .crow/book/site/pages.html && grep -q '<svg' .crow/book/site/pages.html
      - name: Disk used by the run
        if: always()
        run: df -h / | tail -1; du -sh target .crow_build 2>/dev/null || true
