name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # incremental caches are most of a debug target's bulk, and every
      # generated program here is built once
      CARGO_INCREMENTAL: 0
      # each book worker keeps its own dependency build; two fit the runner
      CROW_BOOK_JOBS: 2
    steps:
      - name: Free disk space (the suites compile dozens of programs)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --workspace
      - name: Live runtime tests (the feature the workspace run leaves off)
        run: cargo test -p crow_web --features live
      - name: Build crow
        run: cargo build --release
      - name: Docs cover the compiler (and nothing more)
        run: ./target/release/crow test --docs
      - name: Parity corpus (both execution modes must agree)
        run: ./target/release/crow test --parity
      - name: Book (every code block runs in both modes)
        run: ./target/release/crow test --book
      - name: Book site built by Crow (layout tested, pages written)
        run: |
          ./target/release/crow test docs/book/site.crow
          ./target/release/crow run -i docs/book/site.crow
      - name: Layout engine agrees with the browser (fixtures measured once, checked without one)
        run: ./target/release/crow test tests/layout/conformance.crow
      - name: Layout example
        run: ./target/release/crow test examples/layout_dashboard.crow
      - name: Parts (a page composed of modules with facts, derivations and views)
        run: ./target/release/crow test tests/parts/views/sim.crow && ./target/release/crow test tests/parts/sim/clock.crow && ./target/release/crow check tests/parts/main.crow < /dev/null
      - name: The app's book (derived from the parts fixture, with wireframes)
        run: cd tests/parts && ../../target/release/crow book --write && test -f .crow/book/site/pages.html && grep -q '<svg' .crow/book/site/pages.html
      - name: Disk used by the run
        if: always()
        run: df -h / | tail -1; du -sh target .crow_build 2>/dev/null || true
