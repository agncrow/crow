[package]
name = "crow_db"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"

[dependencies]
crow_runtime = { path = "../crow_runtime" }
serde_json = "1"

# SQLite backend
rusqlite = { version = "0.38.0", features = ["bundled", "column_decltype"], optional = true }

[features]
default = []
sqlite = ["dep:rusqlite"]

