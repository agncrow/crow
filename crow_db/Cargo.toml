[package]
name = "crow_db"
version = "0.1.0"
edition = "2024"

[dependencies]
crow_runtime = { path = "../crow_runtime" }
serde_json = "1"

# SQLite backend
rusqlite = { version = "0.38.0", features = ["bundled", "column_decltype"], optional = true }

# PostgreSQL backend
tokio-postgres = { version = "0.7.16", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
# macros and time: the drivers race a query against a stop (tokio::select!);
# a program without the web layer brings no tokio features of its own
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true }

[features]
default = []
sqlite = ["dep:rusqlite"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:tokio"]

