[package]
name = "crow_runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = { version = "58.0.0", features = ["ipc"], optional = true }
bytemuck = { version = "1.25.0", features = ["derive"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
faer = "0.24.0"
itoa = "1.0.17"
pollster = "0.4.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
rand = "0.10.0"
rand_distr = "0.6.0"
rayon = "1.11.0"
serde = { version = "1", features = ["derive", "rc"] }
rustfft = "6.4.1"
ryu = "1.0.23"
sprs = "0.11.4"
wgpu = "28.0.0"

[features]
arrow = ["dep:arrow"]

[dev-dependencies]
serde_json = "1"
