[package]
name = "crow_runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1.12.3"
serde_json = "1"
# only what writes an IPC stream: arrow's csv and json readers are not used
arrow = { version = "58.0.0", default-features = false, features = ["ipc"], optional = true }
bytemuck = { version = "1.25.0", features = ["derive"], optional = true }
# time zones by the database chrono-tz carries: never the system's local
# zone, whose lookup (iana-time-zone) links CoreFoundation into every program
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
faer = "0.24.0"
# whole numbers of any size, decimals to any digits, fractions (spec,
# Numbers That Keep Every Digit)
dashu-int = "0.6"
dashu-float = "0.6"
dashu-ratio = "0.6"
# erf to the last bit (the A&S approximation was good to 1.5e-7, and gelu
# is written over erf in Crow)
libm = "0.2"
itoa = "1.0.17"
pollster = { version = "0.4.0", optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
rand = "0.10.0"
rand_distr = "0.6.0"
rayon = "1.11.0"
# the byte search the CSV reader splits lines and fields with (SIMD)
memchr = "2.8.0"
serde = { version = "1", features = ["derive", "rc"] }
rustfft = "6.4.1"
# `sys`: the standard library's own layer — a TCP connection, plain or
# behind TLS, for the modules written in Crow (spec, The standard library's
# layer)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
ryu = "1.0.23"
sprs = "0.11.4"
# the GPU, linked only by a program that asks for one (feature `gpu`)
wgpu = { version = "28.0.0", optional = true }
# hash[]: the digests and the password hash, for both modes
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
argon2 = "0.5"
# salts, secrets and tickets come from the operating system
getrandom = "0.3"
# a table in Parquet, read and written by `load` and `save` (the Arrow it
# rides on is the runtime's own)
parquet = { version = "58.0.0", default-features = false, features = ["arrow", "snap", "zstd", "flate2", "flate2-rust_backened", "lz4"], optional = true }
bytes = { version = "1", optional = true }
# a URL or an S3 object wherever a path is read: a blocking client, no
# async runtime of its own, and S3's request signing
# `sys`: an HMAC for the modules written in Crow (S3's signature)
hmac = "0.12"

[features]
arrow = ["dep:arrow"]
# `gpu[…]`: tensors on the GPU through wgpu — and the system frameworks it
# links (Metal, QuartzCore, Foundation), which a program that uses no GPU
# does without (crow's emitter asks for it only where `gpu` is written)
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# the feature a compiled program asks for by what its paths may name
# (crate::sources); the interpreter has it. A remote source is read by the
# protocol written in Crow (src/modules/sys.co): nothing to build in
parquet = ["dep:parquet", "dep:bytes", "arrow"]

[dev-dependencies]
serde_json = "1"
